<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f6f7fb">
	<title>Sign in</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: #172033;
			background: #f6f7fb;
			font-synthesis: none;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 32px 18px;
			background:
				radial-gradient(ellipse at 12% 10%, rgba(111, 92, 242, .11), transparent 34%),
				radial-gradient(ellipse at 88% 90%, rgba(55, 188, 171, .10), transparent 32%),
				#f6f7fb;
		}

		.login-card {
			width: min(100%, 430px);
			padding: 42px;
			border: 1px solid #e8eaf1;
			border-radius: 20px;
			background: #fff;
			box-shadow: 0 24px 70px rgba(30, 39, 68, .10);
		}

		.brand {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 32px;
			color: #172033;
			font-size: 15px;
			font-weight: 750;
			letter-spacing: -.03em;
		}

		.brand-mark {
			display: grid;
			width: 34px;
			height: 34px;
			place-items: center;
			border-radius: 11px;
			background: #6f5cf2;
			color: #fff;
			font-size: 18px;
		}

		h1 { margin: 0; font-size: 29px; letter-spacing: -.045em; }
		.intro { margin: 9px 0 28px; color: #70798d; font-size: 14px; line-height: 1.6; }

		.field { margin-bottom: 18px; }
		label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 650; }

		input[type="email"], input[type="password"] {
			width: 100%;
			height: 48px;
			padding: 0 14px;
			border: 1px solid #dfe3ed;
			border-radius: 9px;
			outline: none;
			background: #fff;
			color: #172033;
			font: inherit;
			font-size: 14px;
			transition: border-color .2s, box-shadow .2s;
		}

		input::placeholder { color: #a0a7b6; }
		input:focus { border-color: #7969f4; box-shadow: 0 0 0 3px rgba(111, 92, 242, .14); }

		.form-options {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 12px;
			margin: 3px 0 24px;
			font-size: 12px;
		}

		.remember { display: inline-flex; align-items: center; gap: 8px; color: #626c80; }
		.remember input { width: 15px; height: 15px; accent-color: #6f5cf2; }
		a { color: #6654e8; font-weight: 650; text-decoration: none; }
		a:hover { text-decoration: underline; }

		button {
			width: 100%;
			height: 48px;
			border: 0;
			border-radius: 9px;
			background: #6f5cf2;
			color: #fff;
			cursor: pointer;
			font: inherit;
			font-size: 14px;
			font-weight: 700;
			transition: background .2s, transform .2s;
		}

		button:hover { background: #5e4ce0; }
		button:active { transform: translateY(1px); }
		button:focus-visible, a:focus-visible { outline: 3px solid #bcb4ff; outline-offset: 3px; }

		.signup { margin: 24px 0 0; color: #70798d; text-align: center; font-size: 13px; }

		@media (max-width: 480px) {
			.login-card { padding: 32px 24px; }
		}
	</style>
</head>
<body>
	<main class="login-card">
		<div class="brand" aria-label="Taskflow">
			<span class="brand-mark" aria-hidden="true">✓</span>
			<span>Taskflow</span>
		</div>

		<h1>Welcome back</h1>
		<p class="intro">Sign in to pick up where you left off.</p>

		<form action="#" method="post">
			<div class="field">
				<label for="email">Email address</label>
				<input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
			</div>

			<div class="form-options">
				<label class="remember" for="remember">
					<input id="remember" name="remember" type="checkbox">
					Remember me
				</label>
				<a href="#forgot-password">Forgot password?</a>
			</div>

			<button type="submit">Sign in</button>
		</form>

		<p class="signup">New to Taskflow? <a href="#sign-up">Create an account</a></p>
	</main>
</body>
</html>
